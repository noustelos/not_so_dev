<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not so.dev</title>
<meta name="description" content="not so.dev — ask Uncle Dev. No app, no sign-up, just ask.">
<link rel="canonical" href="https://notso.dev/">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #0b0c0e;   /* background, cool near-black */
    --lift:     #14171c;   /* faint center lift          */
    --bone:     #ede8df;   /* so.dev — warm, stable, present */
    --phosphor: #ff6b35;   /* the "not" — bright ember correction */
    --mute:     #565a61;   /* utility text               */
    --rule:     #23262c;   /* hairlines                  */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ height:100%; }

  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 34%, var(--lift) 0%, var(--ink) 62%);
    background-attachment:fixed;
    color:var(--bone);
    font-family:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    display:grid;
    grid-template-rows:1fr auto;
    justify-items:center;
    align-items:center;
    padding:clamp(1.25rem, 4vw, 2.5rem);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- stage ------------------------------------------------------ */
  .stage{
    grid-row:1;
    width:100%;
    max-width:44rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1rem, 3vw, 1.6rem);
    text-align:center;
    padding-block:clamp(1.5rem, 5vw, 3rem);
  }

  /* The hero fade lives here, NOT on .stage. .stage is an ancestor of the
     Turnstile container, and Turnstile will not build inside an invisible
     ancestor — fading the whole stage silently kills the bot. */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1rem, 3vw, 1.6rem);
    opacity:0;
    animation:rise 900ms 120ms ease-out forwards;
  }

  .wordmark{
    font-weight:700;
    font-size:clamp(2.1rem, 9vw, 4.4rem);
    line-height:1;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }

  /* reserve the "not" slot so nothing reflows when it ghosts out */
  .not{
    display:inline-block;
    color:var(--phosphor);
    opacity:0;
    animation:breathe 5.6s 1150ms ease-in-out infinite;
  }
  .so{ color:var(--bone); }

  .meta{
    font-size:clamp(0.72rem, 2vw, 0.86rem);
    letter-spacing:0.06em;
    color:var(--mute);
    opacity:0;
    animation:rise 900ms 1500ms ease-out forwards;
  }
  .meta .cursor{
    display:inline-block;
    width:0.6ch;
    color:var(--phosphor);
    animation:blink 1.15s steps(1) 1600ms infinite;
  }

  /* ---- terminal --------------------------------------------------- */
  /* Deliberately NOT faded in. Turnstile scans for its container ~400ms after
     load and refuses to build inside an invisible one, so an opacity:0 reveal
     here silently kills the bot for everyone except prefers-reduced-motion
     users, who were exempted from the fade and therefore worked fine. */
  .terminal{
    width:100%;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:0.9rem;
    opacity:0;
    animation:rise 900ms 1700ms ease-out forwards;
  }

  .ask{
    display:flex;
    align-items:baseline;
    gap:0.6ch;
    flex-wrap:wrap;
    border-bottom:1px solid var(--rule);
    padding-bottom:0.6rem;
  }
  .ask:focus-within{ border-bottom-color:var(--phosphor); }

  .ps1{
    color:var(--phosphor);
    font-size:clamp(0.78rem, 2.1vw, 0.92rem);
    white-space:nowrap;
    user-select:none;
  }

  #q{
    flex:1 1 12ch;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    caret-color:var(--phosphor);
    padding:0.15rem 0;
  }
  #q::placeholder{ color:var(--mute); }

  /* Never name this element id="turnstile". An element id becomes a property
     of window, so <div id="turnstile"> makes window.turnstile the div itself;
     api.js checks window.turnstile, finds it already set, logs "Turnstile
     already has been loaded" and aborts without rendering. Cost a long
     debugging session — the warning names the wrong cause.
     Size is reserved so an empty flex child cannot collapse to zero width. */
  #ts-widget{
    flex:0 0 auto;
    min-width:300px;
    min-height:65px;
  }
  @media (max-width:22rem){ #ts-widget{ min-width:100%; } }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
  }

  #send{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.72rem, 1.9vw, 0.82rem);
    letter-spacing:0.06em;
    padding:0.5rem 1.1rem;
    cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease;
  }
  #send:hover:not(:disabled),
  #send:focus-visible{ border-color:var(--phosphor); color:var(--phosphor); }
  #send:disabled{ opacity:0.4; cursor:not-allowed; }

  .gatemsg{
    color:var(--phosphor);
    font-size:clamp(0.7rem, 1.9vw, 0.8rem);
    line-height:1.6;
    max-width:46ch;
  }

  .out{
    display:block;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    line-height:1.65;
    white-space:pre-wrap;
    min-height:1.65em;
  }
  .out .line + .line{ margin-top:0.5rem; }
  .out .punch{ color:var(--phosphor); }
  .out .working{ color:var(--mute); }
  .out .err{ color:var(--phosphor); }

  /* ---- footer ----------------------------------------------------- */
  /* Three ranks, quietest last: the joke, then contact, then the credit.
     The fade lives on the <footer>, so the two rows arrive together. */
  .site-foot{
    grid-row:2;
    width:100%;
    max-width:44rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.55rem;
    text-align:center;
    opacity:0;
    animation:rise 900ms 1800ms ease-out forwards;
    padding-bottom:clamp(0.5rem, 2vw, 1rem);
  }

  .foot-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:0.6rem 1.25rem;
    flex-wrap:wrap;
  }

  .tagline{
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
  }

  /* mailto: hands off to a mail client — it is not an external page, so no
     target/rel here. Shown in full rather than behind a "Contact" label: a
     visible address can still be copied when the browser has no mail handler. */
  .mailto{
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color 160ms ease, border-color 160ms ease;
  }
  .mailto:hover,
  .mailto:focus-visible{ color:var(--phosphor); border-bottom-color:var(--phosphor); }

  /* ---- studio credit ----
     Copied by hand from askCARNIVORES, never imported: the projects share no
     code. Re-tokenised for this palette — the original's opacity trick would
     sink below AA against --ink, so the quiet state is done with colour. */
  .by{
    display:inline-block;
    padding:0.35rem 0.25rem;
    color:var(--rule);
    font-size:clamp(0.6rem, 1.5vw, 0.68rem);
    font-weight:700;
    letter-spacing:0.09em;
    line-height:1;
    text-decoration:none;
    white-space:nowrap;
    transition:color 250ms ease;
  }
  .by:hover,
  .by:focus-visible{ color:var(--mute); }
  .by__name{ color:var(--mute); }
  .by:hover .by__name,
  .by:focus-visible .by__name{ color:var(--bone); }

  /* the studio's mark, not punctuation */
  .by__mark{
    display:inline-block;
    margin-left:0.18em;
    font-size:0.74em;
    letter-spacing:0.03em;
    transform:translateY(-0.32em);
  }

  /* ---- motion ----------------------------------------------------- */
  @keyframes breathe{
    0%,100%{ opacity:0.05; filter:blur(0.45px); text-shadow:none; }
    50%    { opacity:0.92; filter:blur(0);
             text-shadow:0 0 20px rgba(217,119,87,0.32); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(0.4rem); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    .stage,.hero,.meta,.site-foot,.terminal{ opacity:1; animation:none; transform:none; }
    .mailto,.by{ transition:none; }
    .not{ opacity:0.9; animation:none; filter:none;
          text-shadow:0 0 18px rgba(217,119,87,0.28); }
    .meta .cursor{ animation:none; }
    #send{ transition:none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="hero">
      <h1 class="wordmark" aria-label="not so.dev">
        <span class="not">not&nbsp;</span><span class="so">so.dev</span>
      </h1>
      <p class="meta">// no app, no sign-up, just ask<span class="cursor">_</span></p>
    </div>

    <section class="terminal">
      <div class="ask">
        <label class="ps1" for="q">guest@notso:~$ ask_uncle</label>
        <input id="q" type="text" maxlength="600" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="what does npm audit fix --force actually do?">
      </div>

      <div class="controls">
        <div id="ts-widget" class="cf-turnstile"
             data-sitekey="0x4AAAAAAEZqcunYx3BQf4uN"
             data-theme="dark"
             data-callback="onSuccess"
             data-error-callback="onError"
             data-expired-callback="onExpired"></div>
        <div id="gatemsg" class="gatemsg"></div>
        <button id="send" type="button">ask &crarr;</button>
      </div>

      <output id="out" class="out" for="q" aria-live="polite"></output>
    </section>
  </main>

  <footer class="site-foot">
    <div class="foot-row">
      <!--email_off--><a class="mailto" href="mailto:oops@notso.dev">oops@notso.dev</a><!--/email_off-->
      <span class="tagline">life is vibecoding, every day.</span>
    </div>

    <!-- rel is "noopener" only, deliberately: noreferrer would hide that the
         traffic came from here, and attribution is the whole point. The "/>"
         is decorative, so it stays out of the accessible name. -->
    <a class="by" href="https://noustelos.gr/" target="_blank" rel="noopener">A <span class="by__name">NOUSTELOS_STUDIO</span> PROJECT<span class="by__mark" aria-hidden="true">/&gt;</span></a>
  </footer>

<script>
  /* The public SITE key lives on #ts-widget's data-sitekey — one source of
     truth, read back from the element where needed. The SECRET key exists
     only in the Pages environment. */

  const q    = document.getElementById("q");
  const send = document.getElementById("send");
  const out  = document.getElementById("out");

  let token    = "";    /* set by Turnstile's success callback, not polled */
  let pending  = null;  /* question asked before the challenge resolved */
  let busy     = false;
  let waitTimer = null;

  function print(text, cls){
    out.textContent = "";
    const frag = document.createDocumentFragment();
    for (const raw of String(text).split("\n")){
      const line = raw.trim();
      if (!line) continue;
      const div = document.createElement("div");
      /* the // decompression punchline gets the ember treatment */
      div.className = "line " + (cls || (line.startsWith("//") ? "punch" : ""));
      div.textContent = line;
      frag.appendChild(div);
    }
    out.appendChild(frag);
  }

  /* Ad blockers routinely block challenges.cloudflare.com — and this audience
     runs them. Say so where the widget should have been, in Uncle Dev's voice:
     the gag points at the blocker, never at the person. */
  /* Writes to its OWN element. The previous version emptied #turnstile, which
     destroyed a working widget every time the detection was wrong — and the
     detection was wrong repeatedly. A diagnostic must never break the thing
     it is diagnosing. */
  function gateNote(msg){
    const el = document.getElementById("gatemsg");
    if (!el || el.dataset.noted) return;
    el.dataset.noted = "1";
    el.textContent = msg;
  }

  /* Two very different faults that used to look identical. Blocked = the
     script never arrived. Render failed = it arrived and Cloudflare refused
     the widget (sitekey / hostname). Saying "ad blocker" for both sends
     people chasing the wrong thing. */
  function setBusy(state){
    busy = state;
    send.disabled = state;
    q.disabled = state;
  }

  async function deliver(question){
    setBusy(true);
    print("uncle dev is sighing...", "working");

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question, turnstileToken: token }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok){
        print(data.error || "// Something went sideways on my end. Try again, kid.", "err");
      } else {
        print(data.answer || "// I've got nothing. Ask me again, kid.");
      }
    } catch {
      print("// Can't reach the old server from here. Check your connection, kid.", "err");
    } finally {
      /* Tokens are single-use. Drop it and let Turnstile mint a fresh one —
         the callback refills `token` before the next question lands. */
      token = "";
      resetWidget();
      setBusy(false);
      q.focus();
    }
  }

  function ask(){
    if (busy) return;

    const question = q.value.trim();
    if (!question){
      print("// You have to actually ask me something, kid.", "err");
      return;
    }

    if (!token){
      /* Challenge still in flight. Queue the question and fire it the moment
         the token lands, rather than dead-ending and making them retype. */
      pending = question;
      print("uncle dev is making sure you're not a robot...", "working");

      /* Don't let a stuck challenge hang forever in silence. */
      clearTimeout(waitTimer);
      waitTimer = setTimeout(() => {
        if (!pending) return;
        pending = null;
        print(widgetUp()
          ? "// The bouncer's still squinting at your ID. If there's a checkbox above, tick it; otherwise reload, kid."
          : "// Bot-check never came up. See the note above, kid.", "err");
      }, 15000);
      return;
    }

    deliver(question);
  }

  send.addEventListener("click", ask);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); ask(); }
  });

  /* Implicit rendering, identical to the diagnostic page that renders and
     solves reliably on these browsers. Turnstile builds the widget from the
     data-* attributes and calls these globals — no render(), no ready(), no
     onload, so none of the initialisation states that broke this can occur. */
  window.onSuccess = function(t){
    token = t;
    clearTimeout(waitTimer);
    console.log("turnstile: token received");
    if (pending && !busy){ const p = pending; pending = null; deliver(p); }
  };

  window.onError = function(code){
    token = ""; pending = null; setBusy(false);
    console.error("turnstile error:", code);
    gateNote("// Cloudflare turned the bouncer away (code " + code + "). That's my end, kid, not your browser.");
    return true;
  };

  window.onExpired = function(){ token = ""; resetWidget(); };

  /* Tokens are single-use: without this the second question 403s. */
  function resetWidget(){
    token = "";
    try {
      if (window.turnstile && typeof window.turnstile.reset === "function"){
        window.turnstile.reset("#ts-widget");
      }
    } catch (err) { console.error("turnstile reset failed:", err); }
  }

  function widgetUp(){
    const slot = document.getElementById("ts-widget");
    return !!(slot && slot.childElementCount > 0);
  }


  /* Safety net for the ordering problem above: if implicit rendering still
     found nothing, render it ourselves. Safe to call now that gateNote no
     longer empties the container. Checks the METHOD, never just the object. */
  setTimeout(() => {
    if (widgetUp() || token) return;
    if (!window.turnstile || typeof window.turnstile.render !== "function"){
      console.error("fallback: render unavailable, typeof =",
        window.turnstile ? typeof window.turnstile.render : "no turnstile");
      return;
    }
    try {
      const slot = document.getElementById("ts-widget");
      slot.classList.remove("cf-turnstile");
      const id = window.turnstile.render("#ts-widget", {
        sitekey: slot.dataset.sitekey,
        theme: "dark",
        callback: window.onSuccess,
        "error-callback": window.onError,
        "expired-callback": window.onExpired,
      });
      console.log("fallback render ->", id);
    } catch (err) { console.error("fallback render threw:", err); }
  }, 4000);

  /* An actual rendered widget puts an iframe in the slot. That, not a guess
     about script state, is how we tell "up" from "never arrived". */
  setTimeout(() => {
    if (token || widgetUp()) return;
    console.error("turnstile did not render; window.turnstile:", typeof window.turnstile, "host:", location.hostname);
    gateNote(!window.turnstile
      ? "// Your ad blocker just bounced my bouncer. Allow challenges.cloudflare.com and reload — I'd drop the check entirely, but then the spam bots drink all my coffee."
      : "// Cloudflare refused the badge for this sitekey on " + location.hostname + ". That's my end, kid, not your browser.");
  }, 10000);

</script>
<!-- defer, NOT async: async executes the moment it downloads, which on this
     page happens before the parser reaches #turnstile (it sits behind a large
     inline stylesheet). Turnstile scans for .cf-turnstile once on execution,
     finds nothing, and never renders. defer guarantees a parsed DOM. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</body>
</html>
