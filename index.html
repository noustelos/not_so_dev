<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not so.dev</title>
<meta name="description" content="not so.dev — ask Uncle Dev. No app, no sign-up, just ask.">
<link rel="canonical" href="https://notso.dev/">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #0b0c0e;   /* background, cool near-black */
    --lift:     #14171c;   /* faint center lift          */
    --bone:     #ede8df;   /* so.dev — warm, stable, present */
    --phosphor: #ff6b35;   /* the "not" — bright ember correction */
    --mute:     #565a61;   /* utility text               */
    --rule:     #23262c;   /* hairlines                  */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ height:100%; }

  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 34%, var(--lift) 0%, var(--ink) 62%);
    background-attachment:fixed;
    color:var(--bone);
    font-family:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    display:grid;
    grid-template-rows:1fr auto;
    justify-items:center;
    align-items:center;
    padding:clamp(1.25rem, 4vw, 2.5rem);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- stage ------------------------------------------------------ */
  .stage{
    grid-row:1;
    width:100%;
    max-width:44rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1rem, 3vw, 1.6rem);
    text-align:center;
    padding-block:clamp(1.5rem, 5vw, 3rem);
    opacity:0;
    animation:rise 900ms 120ms ease-out forwards;
  }

  .wordmark{
    font-weight:700;
    font-size:clamp(2.1rem, 9vw, 4.4rem);
    line-height:1;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }

  /* reserve the "not" slot so nothing reflows when it ghosts out */
  .not{
    display:inline-block;
    color:var(--phosphor);
    opacity:0;
    animation:breathe 5.6s 1150ms ease-in-out infinite;
  }
  .so{ color:var(--bone); }

  .meta{
    font-size:clamp(0.72rem, 2vw, 0.86rem);
    letter-spacing:0.06em;
    color:var(--mute);
    opacity:0;
    animation:rise 900ms 1500ms ease-out forwards;
  }
  .meta .cursor{
    display:inline-block;
    width:0.6ch;
    color:var(--phosphor);
    animation:blink 1.15s steps(1) 1600ms infinite;
  }

  /* ---- terminal --------------------------------------------------- */
  .terminal{
    width:100%;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:0.9rem;
    opacity:0;
    animation:rise 900ms 1700ms ease-out forwards;
  }

  .ask{
    display:flex;
    align-items:baseline;
    gap:0.6ch;
    flex-wrap:wrap;
    border-bottom:1px solid var(--rule);
    padding-bottom:0.6rem;
  }
  .ask:focus-within{ border-bottom-color:var(--phosphor); }

  .ps1{
    color:var(--phosphor);
    font-size:clamp(0.78rem, 2.1vw, 0.92rem);
    white-space:nowrap;
    user-select:none;
  }

  #q{
    flex:1 1 12ch;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    caret-color:var(--phosphor);
    padding:0.15rem 0;
  }
  #q::placeholder{ color:var(--mute); }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
  }

  #send{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.72rem, 1.9vw, 0.82rem);
    letter-spacing:0.06em;
    padding:0.5rem 1.1rem;
    cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease;
  }
  #send:hover:not(:disabled),
  #send:focus-visible{ border-color:var(--phosphor); color:var(--phosphor); }
  #send:disabled{ opacity:0.4; cursor:not-allowed; }

  .gatemsg{
    color:var(--phosphor);
    font-size:clamp(0.7rem, 1.9vw, 0.8rem);
    line-height:1.6;
    max-width:46ch;
  }

  .out{
    display:block;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    line-height:1.65;
    white-space:pre-wrap;
    min-height:1.65em;
  }
  .out .line + .line{ margin-top:0.5rem; }
  .out .punch{ color:var(--phosphor); }
  .out .working{ color:var(--mute); }
  .out .err{ color:var(--phosphor); }

  /* ---- footer ----------------------------------------------------- */
  .tagline{
    grid-row:2;
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
    opacity:0;
    animation:rise 900ms 1800ms ease-out forwards;
    padding-bottom:clamp(0.5rem, 2vw, 1rem);
  }

  /* ---- motion ----------------------------------------------------- */
  @keyframes breathe{
    0%,100%{ opacity:0.05; filter:blur(0.45px); text-shadow:none; }
    50%    { opacity:0.92; filter:blur(0);
             text-shadow:0 0 20px rgba(217,119,87,0.32); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(0.4rem); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    .stage,.meta,.tagline,.terminal{ opacity:1; animation:none; transform:none; }
    .not{ opacity:0.9; animation:none; filter:none;
          text-shadow:0 0 18px rgba(217,119,87,0.28); }
    .meta .cursor{ animation:none; }
    #send{ transition:none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="wordmark" aria-label="not so.dev">
      <span class="not">not&nbsp;</span><span class="so">so.dev</span>
    </h1>
    <p class="meta">// no app, no sign-up, just ask<span class="cursor">_</span></p>

    <section class="terminal">
      <div class="ask">
        <label class="ps1" for="q">guest@notso:~$ ask_uncle</label>
        <input id="q" type="text" maxlength="600" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="what does npm audit fix --force actually do?">
      </div>

      <div class="controls">
        <div id="turnstile"></div>
        <button id="send" type="button">ask &crarr;</button>
      </div>

      <output id="out" class="out" for="q" aria-live="polite"></output>
    </section>
  </main>

  <footer class="tagline">life is vibecoding, every day.</footer>

<script>
  /* Public by design — the Turnstile SITE key is safe in the client.
     The SECRET key lives only in the Pages environment. */
  const TURNSTILE_SITE_KEY = "0x4AAAAAAEZqcunYx3BQf4uN";

  const q    = document.getElementById("q");
  const send = document.getElementById("send");
  const out  = document.getElementById("out");

  let widgetId = null;
  let token    = "";    /* set by Turnstile's success callback, not polled */
  let pending  = null;  /* question asked before the challenge resolved */
  let busy     = false;
  let waitTimer = null;

  function print(text, cls){
    out.textContent = "";
    const frag = document.createDocumentFragment();
    for (const raw of String(text).split("\n")){
      const line = raw.trim();
      if (!line) continue;
      const div = document.createElement("div");
      /* the // decompression punchline gets the ember treatment */
      div.className = "line " + (cls || (line.startsWith("//") ? "punch" : ""));
      div.textContent = line;
      frag.appendChild(div);
    }
    out.appendChild(frag);
  }

  /* Ad blockers routinely block challenges.cloudflare.com — and this audience
     runs them. Say so where the widget should have been, in Uncle Dev's voice:
     the gag points at the blocker, never at the person. */
  function gateBlocked(){
    const slot = document.getElementById("turnstile");
    if (!slot || slot.dataset.blocked) return;
    slot.dataset.blocked = "1";
    slot.textContent = "";
    const note = document.createElement("div");
    note.className = "gatemsg";
    note.textContent = "// Your ad blocker just bounced my bouncer. Allow challenges.cloudflare.com and reload — I'd drop the check entirely, but then the spam bots drink all my coffee.";
    slot.appendChild(note);
  }

  function setBusy(state){
    busy = state;
    send.disabled = state;
    q.disabled = state;
  }

  async function deliver(question){
    setBusy(true);
    print("uncle dev is sighing...", "working");

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question, turnstileToken: token }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok){
        print(data.error || "// Something went sideways on my end. Try again, kid.", "err");
      } else {
        print(data.answer || "// I've got nothing. Ask me again, kid.");
      }
    } catch {
      print("// Can't reach the old server from here. Check your connection, kid.", "err");
    } finally {
      /* Tokens are single-use. Drop it and let Turnstile mint a fresh one —
         the callback refills `token` before the next question lands. */
      token = "";
      if (widgetId !== null && window.turnstile) window.turnstile.reset(widgetId);
      setBusy(false);
      q.focus();
    }
  }

  function ask(){
    if (busy) return;

    const question = q.value.trim();
    if (!question){
      print("// You have to actually ask me something, kid.", "err");
      return;
    }

    if (!window.turnstile){
      gateBlocked();
      print("// Can't let you in without the bot-check, kid. See the note above.", "err");
      return;
    }

    if (!token){
      /* Challenge still in flight. Queue the question and fire it the moment
         the token lands, rather than dead-ending and making them retype. */
      pending = question;
      print("uncle dev is making sure you're not a robot...", "working");

      /* Don't let a stuck challenge hang forever in silence. */
      clearTimeout(waitTimer);
      waitTimer = setTimeout(() => {
        if (!pending) return;
        pending = null;
        if (!window.turnstile || widgetId === null){
          gateBlocked();
          print("// Can't let you in without the bot-check, kid. See the note above.", "err");
        } else {
          print("// The bouncer's still squinting at your ID. If there's a checkbox above, tick it; otherwise reload, kid.", "err");
        }
      }, 15000);
      return;
    }

    deliver(question);
  }

  send.addEventListener("click", ask);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); ask(); }
  });

  /* Distinguishes "script never loaded" (blocked / offline) from "challenge
     rendered but unsolved". Without this both are just silence. */
  setTimeout(() => {
    if (!window.turnstile || widgetId === null) gateBlocked();
  }, 5000);

  window.onTurnstileLoad = function(){
    try {
      widgetId = window.turnstile.render("#turnstile", {
        sitekey: TURNSTILE_SITE_KEY,
        theme: "dark",
        callback: (t) => {
          token = t;
          clearTimeout(waitTimer);
          if (pending && !busy){ const p = pending; pending = null; deliver(p); }
        },
        /* Surfaces the real reason instead of a silent empty token. */
        "error-callback": (code) => {
          token = ""; pending = null; setBusy(false);
          print("// The bouncer's ID scanner is jammed (code " + code + "). That's my end, not yours, kid.", "err");
          return true;
        },
        "expired-callback": () => {
          token = "";
          if (widgetId !== null) window.turnstile.reset(widgetId);
        },
      });
    } catch (err) {
      print("// I couldn't even hire the bouncer (" + err.message + "). On me, kid.", "err");
    }
  };
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</body>
</html>
