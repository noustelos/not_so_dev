<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>turnstile debug</title>
<style>
  body{background:#0b0c0e;color:#ede8df;font:13px/1.6 ui-monospace,Menlo,monospace;padding:1.5rem;margin:0}
  h2{color:#ff6b35;font-size:13px;letter-spacing:.08em;margin:1.4rem 0 .4rem}
  pre{white-space:pre-wrap;word-break:break-all;margin:0}
  .ok{color:#7ac47a} .bad{color:#ff6b35} .dim{color:#565a61}
  #slot{margin:.6rem 0}
  button{background:transparent;border:1px solid #23262c;color:#ede8df;font:inherit;padding:.4rem 1rem;cursor:pointer}
</style>
</head>
<body>
<h1 style="font-size:14px;letter-spacing:.1em">TURNSTILE DIAGNOSTIC</h1>
<p class="dim">Not linked from the site. Delete after debugging.</p>

<div id="slot" class="cf-turnstile"
     data-sitekey="0x4AAAAAAEZqcunYx3BQf4uN"
     data-theme="dark"
     data-callback="cb"
     data-error-callback="errcb"></div>

<h2>REPLICA OF INDEX CONDITIONS (opacity:0 parent + zero-width flex child)</h2>
<div style="opacity:0;animation:fadein 900ms 1700ms ease-out forwards">
  <div style="display:flex;justify-content:space-between;gap:1rem">
    <div id="slot2" class="cf-turnstile" data-sitekey="0x4AAAAAAEZqcunYx3BQf4uN" data-theme="dark"></div>
    <span>ask</span>
  </div>
</div>
<style>@keyframes fadein{from{opacity:0}to{opacity:1}}</style>

<button onclick="report()">re-run report</button>
<h2>REPORT</h2>
<pre id="out">collecting…</pre>

<script>
  window.tokenGot = null; window.errCode = null;
  window.cb  = function(t){ window.tokenGot = t; report(); };
  window.errcb = function(c){ window.errCode = c; report(); };

  function line(label, value, good){
    const mark = good === undefined ? "" : (good ? "  [ok]" : "  [!!]");
    return label.padEnd(30) + String(value) + mark;
  }

  function report(){
    const L = [];
    const ts = window.turnstile;

    L.push("== PAGE ==");
    L.push(line("host", location.hostname));
    L.push(line("protocol", location.protocol));

    L.push("\n== TURNSTILE OBJECT ==");
    L.push(line("typeof turnstile", typeof ts, typeof ts === "object"));
    if (ts){
      L.push(line("typeof .render", typeof ts.render, typeof ts.render === "function"));
      L.push(line("typeof .ready",  typeof ts.ready,  typeof ts.ready === "function"));
      L.push(line("typeof .reset",  typeof ts.reset,  typeof ts.reset === "function"));
      try { L.push(line("keys", Object.keys(ts).join(","))); } catch(e){ L.push(line("keys","<throws>")); }
    }

    L.push("\n== WIDGET ==");
    const slot = document.getElementById("slot");
    const slot2 = document.getElementById("slot2");
    L.push(line("slot children (clean)", slot ? slot.childElementCount : "-", !!(slot && slot.childElementCount)));
    L.push(line("slot2 children (replica)", slot2 ? slot2.childElementCount : "-", !!(slot2 && slot2.childElementCount)));
    L.push(line("slot2 width", slot2 ? Math.round(slot2.getBoundingClientRect().width) : "-"));
    L.push(line("token received", window.tokenGot ? window.tokenGot.slice(0,18)+"…" : "none", !!window.tokenGot));
    L.push(line("error-callback code", window.errCode === null ? "none" : window.errCode));

    L.push("\n== SCRIPT TAGS IN DOM ==");
    document.querySelectorAll("script[src]").forEach(s => L.push("  " + s.src));

    L.push("\n== ALL LOADED RESOURCES matching turnstile / cdn-cgi / challenge ==");
    try {
      const res = performance.getEntriesByType("resource")
        .filter(r => /turnstile|cdn-cgi|challenge/i.test(r.name));
      if (!res.length) L.push("  (none)");
      res.forEach(r => L.push("  " + Math.round(r.startTime) + "ms  " + r.initiatorType.padEnd(9) + r.name));
      L.push(line("\n  api.js load count", res.filter(r => /api\.js/.test(r.name)).length));
    } catch(e){ L.push("  performance API unavailable: " + e.message); }

    document.getElementById("out").textContent = L.join("\n");
  }

  /* explicit render attempt, fully logged */
  setTimeout(() => {
    const slot = document.getElementById("slot");
    const pre  = [];
    if (slot && slot.querySelector("iframe")){ pre.push("implicit render WORKED — no fallback needed"); report(); return; }
    pre.push("implicit render did NOT happen after 3s");
    if (!window.turnstile){ pre.push("window.turnstile missing — script blocked"); report(); return; }
    if (typeof window.turnstile.ready !== "function"){
      pre.push("turnstile.ready is NOT a function (typeof " + typeof window.turnstile.ready + ")");
    }
    try {
      const run = () => {
        try {
          slot.classList.remove("cf-turnstile");
          const id = window.turnstile.render("#slot", {
            sitekey: slot.dataset.sitekey, theme: "dark",
            callback: window.cb, "error-callback": window.errcb,
          });
          pre.push("explicit render returned: " + String(id));
        } catch (err){ pre.push("explicit render THREW: " + err.message); }
        window.preNotes = pre; report();
      };
      if (typeof window.turnstile.ready === "function"){
        pre.push("calling turnstile.ready()…");
        let fired = false;
        window.turnstile.ready(() => { fired = true; pre.push("ready() callback FIRED"); run(); });
        setTimeout(() => { if (!fired){ pre.push("ready() callback NEVER FIRED after 4s — rendering anyway"); run(); } }, 4000);
      } else { run(); }
    } catch (err){ pre.push("outer throw: " + err.message); window.preNotes = pre; report(); }
  }, 3000);

  const origReport = report;
  report = function(){ origReport(); if (window.preNotes){
    document.getElementById("out").textContent =
      "== RENDER TRACE ==\n  " + window.preNotes.join("\n  ") + "\n\n" + document.getElementById("out").textContent;
  }};

  report();
  setTimeout(report, 9000);
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
